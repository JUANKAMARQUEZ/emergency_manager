{% extends "base.html" %}

{% block title %}Perfil{% endblock %}

{% block content %}

<div class="form-card">

    <!-- TÍTULO -->

    <div class="d-flex align-items-center gap-3 mb-4">

        <div class="profile-avatar">

            <i class="bi bi-person-fill"></i>

        </div>

        <div>

            <h2 class="form-title mb-1">
                Mi perfil
            </h2>

            <p class="text-muted mb-0">
                Gestiona tu información personal
            </p>

        </div>

    </div>

    <!-- FORMULARIO -->

    <form method="POST">

        <!-- NOMBRE -->

        <div class="mb-4">

            <label class="form-label">
                Nombre
            </label>

            <input type="text" name="name" value="{{ user.name }}" class="form-control modern-input"
                placeholder="Introduce tu nombre">

        </div>

        <!-- EMAIL -->

        <div class="mb-4">

            <label class="form-label">
                Email
            </label>

            <input type="email" name="email" value="{{ user.email }}" class="form-control modern-input"
                placeholder="Introduce tu email" readonly>

        </div>

        <!-- CONTRASEÑA -->

        <div class="mb-4">

            <div class="mb-4">

                <label class="form-label">

                    Contraseña actual

                </label>

                <input type="password" name="current_password" class="form-control modern-input">

            </div>

            <label class="form-label">
                Nueva contraseña
            </label>

            <input type="password" name="password" class="form-control modern-input"
                placeholder="Dejar vacío para mantener la actual">

        </div>

        <!-- BOTONES -->

        <div class="form-actions">

            <button class="btn custom-btn">

                <i class="bi bi-floppy me-2"></i>

                Guardar cambios

            </button>

            <a href="/dashboard" class="btn nav-btn text-dark border">

                Cancelar

            </a>

        </div>

    </form>

</div>

<script>

    const passwordInput =
        document.querySelector('input[name="password"]');

    const currentPasswordInput =
        document.querySelector('input[name="current_password"]');

    passwordInput.addEventListener("input", function () {

        if (passwordInput.value.trim() !== "") {

            currentPasswordInput.required = true;
        }

        else {

            currentPasswordInput.required = false;
        }
    });

</script>

{% endblock %}
