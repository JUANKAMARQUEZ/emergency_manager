{% extends "base.html" %}

{% block title %}Perfil{% endblock %}

{% block content %}

<h2>Mi perfil</h2>

<form method="POST">

<input type="text" name="name" value="{{ user.name }}" class="form-control mb-2">

<input type="email" name="email" value="{{ user.email }}" class="form-control mb-2">

<input type="password" name="password" placeholder="Nueva contraseña" class="form-control mb-2">

<button class="btn btn-primary">Guardar</button>

</form>

{% endblock %}
