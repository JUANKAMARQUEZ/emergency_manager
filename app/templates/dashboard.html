{% extends "base.html" %}

{% block title %}Panel de Control{% endblock %}

{% block content %}

<h2 class="dashboard-title mb-4">
    Panel de Control
</h2>

<div class="row g-4">

<div class="col-md-4">
<div class="card dashboard-card text-center p-4">

<i class="bi bi-exclamation-triangle dashboard-icon"></i>
<h5 class="mt-3">
Total Incidencias
</h5>
<h2>{{ total }}</h2>

</div>
</div>

<div class="col-md-4">
<div class="card dashboard-card text-center p-4">

<i class="bi bi-broadcast dashboard-icon"></i>
<h5 class="mt-3">Incidencias Activas</h5>
<h2>{{ active }}</h2>

</div>
</div>

<div class="col-md-4">
<div class="card dashboard-card text-center p-4">

<i class="bi bi-check-circle dashboard-icon"></i>
<h5 class="mt-3">Incidencias Finalizadas</h5>
<h2>{{ closed }}</h2>

</div>
</div>

</div>

<div class="mt-4 d-flex gap-3 flex-wrap">

<a href="/incidents/create" class="btn custom-btn">
<i class="bi bi-plus-circle me-2"></i>
Crear nueva incidencia
</a>

<a href="/incidents" class="btn custom-btn">
<i class="bi bi-list-ul me-2"></i>
Ver incidencias
</a>

<a href="/map" class="btn custom-btn">
<i class="bi bi-map me-2"></i>
Ver mapa de incidencias
</a>

</div>

{% endblock %}
