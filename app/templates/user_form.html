{% extends "base.html" %}

{% block title %}Usuario{% endblock %}

{% block content %}

<h2>{{ 'Editar usuario' if user else 'Nuevo usuario' }}</h2>

<form method="POST">

<div class="mb-2">
<input type="text" name="name" placeholder="Nombre"
value="{{ user.name if user else '' }}" class="form-control" required>
</div>

<div class="mb-2">
<input type="email" name="email" placeholder="Email"
value="{{ user.email if user else '' }}" class="form-control" required>
</div>

<div class="mb-2">
<input type="password" name="password" placeholder="Contraseña"
class="form-control">
</div>

<div class="mb-2">
<select name="role" class="form-control">

{% for role in roles %}
<option value="{{ role.id }}"
{% if user and user.role_id == role.id %}selected{% endif %}>
{{ role.name }}
</option>
{% endfor %}

</select>
</div>

<button class="btn btn-primary">Guardar</button>

</form>

{% endblock %}
