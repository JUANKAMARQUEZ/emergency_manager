{% extends "base.html" %}

{% block title %}Usuario{% endblock %}

{% block content %}

<div class="form-card">

    <!-- CABECERA -->

    <div class="d-flex align-items-center gap-3 mb-4">

        <div class="profile-avatar">

            <i class="bi bi-person-fill"></i>

        </div>

        <div>

            <h2 class="form-title mb-1">

                {% if user %}

                    Editar usuario

                {% else %}

                    Nuevo usuario

                {% endif %}

            </h2>

            <p class="text-muted mb-0">

                {% if user %}

                    Modifica la información del usuario

                {% else %}

                    Crea un nuevo usuario del sistema

                {% endif %}

            </p>

        </div>

    </div>

    <!-- FORMULARIO -->

    <form method="POST">

        <!-- NOMBRE -->

        <div class="mb-4">

            <label class="form-label">
                Nombre
            </label>

            <input
                type="text"
                name="name"
                placeholder="Nombre"
                value="{{ user.name if user else '' }}"
                class="form-control modern-input"
                required
            >

        </div>

        <!-- EMAIL -->

        <div class="mb-4">

            <label class="form-label">
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Email"
                value="{{ user.email if user else '' }}"
                class="form-control modern-input"
                required
            >

        </div>

        <!-- CONTRASEÑA -->

        <div class="mb-4">

            <label class="form-label">
                Contraseña
            </label>

            <input
                type="password"
                name="password"
                placeholder="{% if user %}Dejar vacío para mantener la actual{% else %}Introduce una contraseña{% endif %}"
                class="form-control modern-input"
            >

        </div>

        <!-- ROL -->

        <div class="mb-4">

            <label class="form-label">
                Rol
            </label>

            <select
                name="role"
                class="form-select modern-select"
            >

                {% for role in roles %}

                <option
                    value="{{ role.id }}"
                    {% if user and user.role_id == role.id %}selected{% endif %}
                >

                    {{ role.name }}

                </option>

                {% endfor %}

            </select>

        </div>

        <!-- BOTONES -->

        <div class="form-actions">

            <button class="btn custom-btn">

                <i class="bi bi-floppy me-2"></i>

                Guardar usuario

            </button>

            <a href="/users" class="btn nav-btn text-dark border">

                Cancelar

            </a>

        </div>

    </form>

</div>

{% endblock %}
