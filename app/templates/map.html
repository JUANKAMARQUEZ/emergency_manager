{% extends "base.html" %}

{% block title %}Mapa de incidencias{% endblock %}

{% block extra_head %}

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2 class="dashboard-title mb-1">

            <i class="bi bi-geo-alt-fill me-2"></i>

            Mapa de incidencias

        </h2>

        <p class="text-muted mb-0">
            Visualización operativa en tiempo real
        </p>

    </div>

</div>

<div class="map-filters-card mb-4">

    <div class="row">

        <!-- ESTADO -->

        <div class="col-md-4">

            <h5 class="filter-title">

                <i class="bi bi-broadcast me-2"></i>

                Estado

            </h5>

            <div class="d-flex flex-column gap-2 mt-3">

                <label class="modern-check">

                    <input type="checkbox" id="filterActive" checked>

                    <span>Activas</span>

                </label>

                <label class="modern-check">

                    <input type="checkbox" id="filterClosed" checked>

                    <span>Finalizadas</span>

                </label>

            </div>

        </div>

        <!-- TIPOS -->

        <div class="col-md-8">

            <h5 class="filter-title">

                <i class="bi bi-funnel-fill me-2"></i>

                Tipos de incidencia

            </h5>

            <div class="d-flex flex-wrap gap-3 mt-3">

                <label class="modern-check">
                    <input type="checkbox" class="filterType" value="Incendio" checked>
                    <span>Incendio</span>
                </label>

                <label class="modern-check">
                    <input type="checkbox" class="filterType" value="Asistencia Sanitaria" checked>
                    <span>Sanitaria</span>
                </label>

                <label class="modern-check">
                    <input type="checkbox" class="filterType" value="Incidencia de Tráfico" checked>
                    <span>Tráfico</span>
                </label>

                <label class="modern-check">
                    <input type="checkbox" class="filterType" value="Seguridad Ciudadana" checked>
                    <span>Seguridad</span>
                </label>

                <label class="modern-check">
                    <input type="checkbox" class="filterType" value="Otros" checked>
                    <span>Otros</span>
                </label>

            </div>

        </div>

    </div>

</div>

<div id="map" class="operations-map"></div>

{% endblock %}

{% block scripts %}

<script id="incidents-data" type="application/json">
{{ incidents | tojson }}
</script>

<script>

var map = L.map('map').setView([37.3886, -5.9823], 13);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
maxZoom: 19
}).addTo(map);

var redIcon = L.icon({
iconUrl: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png",
shadowUrl: "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png",
iconSize: [25,41],
iconAnchor: [12,41]
});

var greenIcon = L.icon({
iconUrl: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png",
shadowUrl: "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png",
iconSize: [25,41],
iconAnchor: [12,41]
});

var incidents = JSON.parse(
document.getElementById("incidents-data").textContent
);

var markers = [];

function drawIncidents(){

markers.forEach(m => map.removeLayer(m));
markers = [];

var showActive = document.getElementById("filterActive").checked;
var showClosed = document.getElementById("filterClosed").checked;

var typesChecked = [];
document.querySelectorAll(".filterType:checked").forEach(el => {
typesChecked.push(el.value.toLowerCase());
});

incidents.forEach(function(incident){

if(!incident.latitude || !incident.longitude) return;

if(incident.status === "activa" && !showActive) return;
if(incident.status === "finalizada" && !showClosed) return;

var match = typesChecked.some(t => 
incident.type.toLowerCase().includes(t)
);

if(!match) return;

var icon = incident.status === "activa" ? redIcon : greenIcon;

var marker = L.marker(
[parseFloat(incident.latitude), parseFloat(incident.longitude)],
{icon: icon}
).addTo(map);

marker.bindPopup(
"<b>" + incident.address + "</b><br>" +
"<b>Tipo:</b> " + incident.type + "<br>" +
"<b>Descripción:</b> " + incident.incidence + "<br>" +
"<b>Recurso:</b> " + incident.resource + "<br>" +
"<b>Resolución:</b> " + incident.resolution + "<br>" +
"<b>Estado:</b> " + incident.status
);

markers.push(marker);

});

}

drawIncidents();

document.querySelectorAll("input").forEach(el => {
el.addEventListener("change", drawIncidents);
});

</script>

{% endblock %}
